      # The IAEA's protection zone (decided with the user, 22 October 2026): proposed in its report of 6 September 2022,
      # never agreed; on 30 March 2023 the IAEA turned from a zone to actions the parties should avoid. No size was ever
      # published (AP, 12 September 2022: "including the radius" still being explored); Grossi: limited "to the
      # perimeter and the plant itself". So the circle is drawn round the plant's site as OpenStreetMap maps it.
