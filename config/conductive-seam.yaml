      # south_bank, crossing or north_bank (the shores of 5 June 2023), or unknown (no place published: the whole bar,
      # said so). `open_end`: the window's end isn't reported (drawn fading to `until`).
      truces:
        - {n: 1, line: Dniprovska, from: 2025-10-18, until: 2025-10-23, region: occupied, where: "in an area under Russian control", src: [aj_2025_10_18, ap_2025_10_23]}
