    line: Ferosplavna-1
    stretch: held
    name: "Ferosplavna-1, north of the Dnipro, on the Ukrainian-controlled side"
    granularity: bank / side of the front
    why: "The sources' 'the other side of the Dnipro River', 'the right bank', 'the northern bank', 'Ukrainian-controlled territory': the line from the channel (the front) to its substation by Nikopol"
    label: {at_km: 31, offset_px: [-10, 100], text: ["Ferosplavna-1, north of the Dnipro"]}
  - id: fe-south
    line: Ferosplavna-1
    stretch: south_bank
    name: "Ferosplavna-1, the south bank: the thermal plant to the shore"
    granularity: bank (the sources' distances, never a point)
    why: "'about 1.8 kilometres from the ZTPP's switchyard', 'around three kilometres from the ZNPP's site perimeter', 'near the ZTPP switchyard': drawn as the whole stretch from the thermal plant's switchyard to the shore of 5 June 2023"
    label: {at: 0.9, offset_px: [150, -6], text: ["Ferosplavna-1, the south bank"]}
  - id: switchyards
    around: [npp750, tpp330]
    margin_km: 0.6
    name: "The plant's 750 kV switchyard, the thermal plant's 330 kV switchyard and the lines between them"
    granularity: facility (drawn as an area round both)
    why: "Repairs at the thermal plant's switchyard and on the link between it and the plant's autotransformer: facilities, drawn as one area round both switchyards"
    label: {offset_px: [-200, 110], anchor: r, text: ["the plant's and the thermal plant's switchyards"]}
  - id: dn-occupied
    line: Dniprovska
    stretch: occupied
    name: "Dniprovska, the occupied side"
    granularity: side of the front
    why: "'damaged in an area under Russian control' (Al Jazeera/AP), 'on the other side of the frontline' (IAEA): the line from the plant's switchyard to the channel (the front)"
    label: {at: 0.0, offset_px: [-40, -150], anchor: r, text: ["Dniprovska, the occupied side"]}
  - id: dn-crossing
    line: Dniprovska
    stretch: crossing
    name: "Dniprovska, the crossing: the tall towers across the Dnipro"
    granularity: the crossing
    why: "'the damaged section of the power line crosses high above the river' (IAEA), 'high pylons across the Dnipro River' (WNN): the line between the shores of 5 June 2023"
    label: {at: 0.55, offset_px: [180, 40], text: ["Dniprovska, the crossing"]}
  - id: dn-north
    line: Dniprovska
    stretch: held
    beyond_frame: true
    name: "Dniprovska, north of the Dnipro, on the Ukrainian-controlled side (it runs on beyond the frame)"
    granularity: side of the front
    why: "'on Ukrainian-controlled territory in Dnipropetrovsk oblast' (Energoatom), 'in Ukrainian-controlled territory' (IAEA): the line from the channel on; it leaves the frame 21 km out, and its far end, the Dniprovska substation, is never shown"
    label: {at_km: 15.5, offset_px: [140, 10], text: ["Dniprovska, north of the Dnipro", "and on beyond the frame"]}

