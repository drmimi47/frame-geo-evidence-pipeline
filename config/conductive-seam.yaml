        - {n: 3, line: Ferosplavna-1, from: 2025-11-07, until: 2025-11-08, region: south_bank, where: "the south bank, between the thermal plant and the shore", src: [up_2025_11_07, mind_2025_11]}
        - {n: 4, line: Ferosplavna-1, from: 2026-01-17, until: 2026-01-19, region: unknown, where: "not published", src: [up_2026_01_17, liga_2026_01]}
