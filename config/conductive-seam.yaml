    unrolled:
      # The two last lines unrolled (NEXT.md I5, idea 1; the user, 4 November 2026: "grow from left to right and the
      # video pan as time goes on", time left to right and "only the most critical stuff"): each line unrolled into an
      # upright bar, km up from its switchyard; the bars move right with the date, the record's states left behind as
      # ribbons, and the repair truces as regions as tall as their sources say (the safety rule: a stretch of at least
      # about 3 km, never a tower, a pin or a crew; unrolled.py refuses less).
      title: ZNPP-last-two-lines-unrolled
      width: 1920
      height: 1080
      fps: 60                    # tests at 30 (--fps 30)
      show_km: 20                # each bar this long (the river and the truces near it given room); both lines go on, said so
      lines:                     # Ferosplavna-1 the lower ribbon, Dniprovska the upper
        - {record: Ferosplavna-1, drawn: "Ferosplavna 1, 2", label: "FEROSPLAVNA-1 · 330 KV", from: "the thermal plant's 330 kV switchyard", to: "Ferosplavna substation"}
        - {record: Dniprovska, drawn: Dniprovska, label: "DNIPROVSKA · 750 KV", from: "the plant's 750 kV switchyard", to: "Dniprovska substation (not shown)"}
      water_pass: s2a_20230605T0836   # the reservoir's shores along each line the day before the dam (survey.json)
      river_pass: s2b_20230908T0836   # the Dnipro's channel through the drained bed (survey.json): the front
      dam: {at: 2023-06-06, label: "THE KAKHOVKA DAM DESTROYED", src: [iaea_161]}
      scale_change: 2025-09-01   # the last year drawn larger, said on the axis
      px_per_day: [1.0, 6.0]     # before and after scale_change (said on the axis: six times the scale)
      sides:
        occupied: "OCCUPIED SIDE"
        held: "UKRAINIAN-CONTROLLED SIDE"
        sources: [aj_2025_10_18, ukrinform_2026_06]
      sources:
        aj_2025_10_18: {title: "Al Jazeera (AP), 18 October 2025: repairs begin as ceasefire zones are set", url: "https://www.aljazeera.com/news/2025/10/18/zaporizhzhia-nuclear-plant-repairs-begin-in-ukraine-as-ceasefire-zones-set"}
        ukrinform_2026_06: {title: "Ukrinform, June 2026: a ceasefire for repairs to the tall towers near the demarcation line on the Dnipro", url: "https://ukrinform.net/rubric-economy/4130748-iaea-secures-ceasefire-for-repairs-to-power-line-supplying-znpp.html"}
        wnn_2026_06: {title: "World Nuclear News, June 2026: substation damage stopping reconnection", url: "https://world-nuclear-news.org/articles/substation-damage-stopping-zaporizhzhia-power-line-reconnection-says-iaea"}
        up_2025_11_07: {title: "Ukrainska Pravda, 7 November 2025: a local ceasefire, the ground demined", url: "https://www.pravda.com.ua/eng/news/2025/11/07/8006360"}
        mind_2025_11: {title: "Mind.ua, November 2025: the plant reconnected to its backup line", url: "https://mind.ua/news/20297101-zaes-znovu-pidklyuchili-do-rezervnogo-zhivlennya"}
        liga_2026_01: {title: "Liga.net, January 2026: repair of the backup line begins", url: "https://news.liga.net/en/politics/news/repair-of-a-backup-power-line-near-zaporizhzhia-npp-begins-photo"}
        iaea_161: {title: "IAEA, Update 161: the Kakhovka dam destroyed, the reservoir falling", url: "https://www.iaea.org/newscenter/pressreleases/update-161-iaea-director-general-statement-on-situation-in-ukraine"}
        wnn_2026_09: {title: "World Nuclear News, September 2026: local ceasefire for power line repairs", url: "https://www.world-nuclear-news.org/articles/local-ceasefire-in-place-for-zaporizhzhia-power-line-repairs"}
