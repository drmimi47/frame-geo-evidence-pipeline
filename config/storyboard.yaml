    title: The proposed level, drawn under the crossing
    status: draft
    source: waterline-reprise
    in: 0
    out: 9
    tells: "The same view, the proposed 12.7 m level drawn as a line where the scene's surfaces cross it; proposed level, inferred heights; nothing flooded. Plain for 2 s, then the line fades in round the caisson's foot and across the reeds near the horizon, with a small label (PROPOSED LEVEL · 12.7 M · VYSHNEVSKYI & SHEVCHUK 2024 · THE BED'S HEIGHTS INFERRED). 12.7 m Baltic is 13.1 m in the scene (EGM2008, +0.4 m); the camera's eye is 2.25 m below it. Sound: the line and the near nightingale only, a stretch of the shot's own soundscape."
    from: research_notes/Under the crossing still (v5); ZNPP speculative ending and ecology
    needs: "Whether the line reads at full size (it is about 2 px); the level's datum (Baltic assumed) checked against the paper's page."
    tags: [ending, forest-or-reactor, great-meadow, water, speculative]
  drowning:
    title: The proposed level, rising under the crossing (speculative)
    status: draft
    source: drowning-continuous   # the hum unbroken from under-the-crossing (v7's `drowning`, rising from silence, deleted 9 November 2026)
    in: 0
    out: 15
    tells: "The drowning, to replace waterline-reprise straight after under-the-crossing: the same view running on from its last frame (the flow dashes and the far birds continue; frame 0 is the frame after under-the-crossing's last), then months compressed into seconds as a flat water surface (drawn) climbs to the proposed 12.7 m (13.1 m in the scene) through the scene's own inferred ground: first between the stems where the lane is lowest (about 1.5 s), the shortest plants going under first, the willows' crowns staying above. At 4.2 s the waterline sweeps up over the lens; under it the bottom is dark and silty, the drowned plants dulled and greyed toward silt the longer they are under, while the tower and the lit wires waver faintly through the surface; held from 10 s to the end. No line, no caption. Sound: under-the-crossing ends with the line alone fading to silence (its birds gone by 27.5 s), so the drowning keeps that state: the synthesized line rising back from silence over 2.5 s (the soundscape run on past 30 s), muffled once the lens is under."
    from: research_notes/Under the crossing still (v7); ZNPP speculative ending and ecology
    needs: "The statement has to be said elsewhere in the film (this shot's caption field, a card or the credits; the user decides): PROPOSED LEVEL · 12.7 M · VYSHNEVSKYI & SHEVCHUK 2024 · REACHED OVER MONTHS · THE BED'S HEIGHTS INFERRED · DRAWN, and that the view under the water and its silt are a drawn convention. For the hum to run unbroken through the cut, under-the-crossing's sound would be replaced by v7/alt/under_the_crossing_f_day_continuous.mp4 and this shot by v7/alt/drowning_continuous.mp4 (the user decides; as it stands the hum dips to silence across the cut). The level's datum (Baltic assumed) checked against the paper's page."
    tags: [ending, forest-or-reactor, great-meadow, water, speculative]
  drowning-v11:
    title: The water back at the proposed level, the trees dead (speculative)
    status: new
    source: drowning-v11
    in: 0
    out: 15
    tells: "A hard cut from under-the-crossing straight to under the water, already back at the proposed 12.7 m (13.1 m in the scene) (the user, 8-9 November 2026, v9-v11): the camera where it was, 2.25 m under the surface. The herbs and grasses gone, a few taller shrubs and reeds as bare stems, every tree standing dead and bare with only its thickest branches; where trunks and branches pierce the surface, a churning pale collar and short broken wakes drifting downstream, so the waterline on the trees reads. The 750 kV tower and the lit wires waver through the surface (less murk than v7/v8); the surface's pattern evolves rather than slides. Sound: the line muffled from the first frame, going on from under-the-crossing's last sample."
    from: research_notes/Under the crossing still (v9-v11)
    needs: "The statement said elsewhere: PROPOSED LEVEL · 12.7 M · VYSHNEVSKYI & SHEVCHUK 2024 · THE TREES DEAD AND STANDING, THE BED'S HEIGHTS INFERRED · DRAWN; and that the view under the water (seeing the tower through the surface: Snell's window not drawn), the foam and the dead state are drawn. The dead state's timescale (drowned trunks standing for years) to check against a source."
    tags: [ending, forest-or-reactor, great-meadow, water, speculative]
  drowning-v8:
    title: The proposed level, the plants dying under it (speculative)
    status: new
    source: drowning-v8-continuous
    in: 0
    out: 15
    tells: "The drowning with the plants dying off (the user, 8 November 2026: the plants die as the water rises, so at the end only the tower and the lines show): v7's fixed camera, water and sound, frame 0 the same (the join with under-the-crossing unchanged). Each plant turns brown as the drawn water reaches its base, then by kind loses its leaves, slumps, falls and settles into the bed: herbs by 5.4-7.7 s, reeds by 9.4 s, shrubs by 10.7 s, willows and poplars bare and settled by 12.6 s, their crowns dying above the surface too. The lens goes under at 4.2 s; it ends in murky water over a dark floor, the tower and the lit wires wavering through the surface. Years compressed into seconds (drowned willows die over one to a few seasons, trunks can stand for decades). Parked beside drowning (v7) to compare."
    from: research_notes/Under the crossing still (v8)
    needs: "The statement said elsewhere: PROPOSED LEVEL · 12.7 M · VYSHNEVSKYI & SHEVCHUK 2024 · THE PLANTS' DYING COMPRESSED FROM YEARS · THE BED'S HEIGHTS INFERRED · DRAWN. The view reads clear from about 9.5 s, so about 5 s of empty hold: trim the out to about 12.5 s, or slow the trees and render again. The die-off's timescales to check against a source."
    tags: [ending, forest-or-reactor, great-meadow, water, speculative]
  water-voices:
    title: Who wants the water back
    card: |
      “To flood this place again would be another crime,”
      says an ecologist.
      Scientists say the willows hold the old silt's heavy metals in place.

      “I just want there to be water again,”
      says a village head on the old shore.
    status: draft
    duration: 12
    tells: "Nefedov in the Irish Times (21 November 2025); the willows holding the ~83,300 t of heavy metals in the silt, 'scientists say' (Hmarochos, 3 September 2025; no uptake measured; IGB for the tonnage); the Malokaterynivka village head (in the report's sources). Both sides, neither chosen."
    from: ZNPP speculative ending and ecology (Against refilling; the bed is also contaminated)
    needs: "The ecologist's and the village head's full names and the village head's source checked before naming either on screen; reopen both quotes."
    tags: [ending, forest-or-reactor, great-meadow, water]
  water-river:
    title: Another way, from the river
    card: |
      Engineers have proposed another way:
      leave the dam unbuilt, and pump from the river
      for the fields, the towns and the plant's cooling pond.
      Ecologists propose small reservoirs on the tributaries
      and the main channel left open.

      The choice has not been made.
    status: draft
    duration: 12
    tells: "A Ukrainian engineer's 'do not restore' option, with new pumping stations 'including for supplying the cooling reservoir at the Zaporizhzhia nuclear plant' (Hydropower & Dams); Moisiienko's August 2026 compromise, ~200,000 of the former 215,000 ha left wild, ~15,000 ha of small reservoirs on tributaries, 'we won't block the main channel' (Intent). So the forest and a restart are not strictly exclusive."
    from: ZNPP speculative ending and ecology (Against refilling)
    tags: [ending, forest-or-reactor, great-meadow, water]
  water-cooling:
    title: Kept cool, not able to run
    card: |
      Since April 2024 the six reactors have been in cold shutdown.
      Wells on the site keep the fuel cool. To run again, the plant would need the river.

      Without the reservoir, its cooling pond is sinking:
      16.65 m above sea level in June 2023, 12.27 m reported in October 2026.
      At about 12 m its pumps would stop.
    status: draft
    duration: 15
    tells: water-wells and water-pond in one card (the storyboard review, 5 November 2026), their sources as theirs; the pumping station's figures left to restart-watch.
    needs: The pond's 2026 figure against the section's (12.34 m on its own day); the IAEA's wording of the 12 m limit.
    from: reports/Powerlines storyboard review.md (item 4)
    tags: [water, cooling-pond, buying-time]
  water-choice:
    title: Who wants the water back, and another way
    card: |
      “To flood this place again would be another crime,” says an ecologist.
      “I just want there to be water again,” says a village head on the old shore.

      Engineers propose leaving the dam unbuilt and pumping from the river;
      ecologists, small reservoirs on the tributaries and the main channel left open.

      The choice has not been made.
    status: draft
    duration: 14
    tells: water-voices and water-river in one card (the storyboard review, 5 November 2026), their sources as theirs; the willows and the silt's metals left out.
    needs: The ecologist's and the village head's full names and the village head's source checked before naming either on screen.
    from: reports/Powerlines storyboard review.md (item 4)
    tags: [ending, forest-or-reactor, water]
  water-last:
    title: Tied to the water
    card: |
      The lines carried the plant's power out.
      Now they carry a trickle in, to keep it safe.

      Its future is tied to the water,
      and the water's, to the forest.
    status: draft
    duration: 9
    tells: "The film's own reflection, not a source's: the lines built to carry gigawatts out carry 11-50 MW in for the plant's own needs (Energoatom via Interfax-Ukraine, Ukrainska Pravda); the plant's water and the forest's ground are the same water. Then 'One line of ten' returns to the observed."
