        out_s: 3.0
        tail_s: 0.6
        measure: "The plant's lines reach {km} km from it"
        sublabel: "No size was published: 'the perimeter and the plant itself' (Grossi) · drawn round the site, {km} km across"
        note: "The smallest circle round the plant's site as OpenStreetMap maps it; the IAEA published no boundary or radius"
