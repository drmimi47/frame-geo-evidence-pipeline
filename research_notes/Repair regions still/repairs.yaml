# Where crews were sent to repair the ZNPP's lines, 2022-2026, as published: the input of scripts/repair_regions.py.
# Researched 5 November 2026 from the IAEA's updates (read in full through the globalsecurity.org and reliefweb.int
# mirrors: iaea.org refuses automated reads), Energoatom, Ukrenergo and the news that carried them. `place` is the
# source's own wording. A repair goes in a region only as coarse as that wording or coarser: a side of the front, a
# bank, the crossing, a whole stretch of line, or the area round the two switchyards; a distance from the plant is
# never turned into a point (CLAUDE.md, NEXT.md I5): it is placed in the wider area its other words (or the line's own
# course) put it in, and `inferred` says so. No place published: `region: null`, counted, not drawn.
# `GS ` = https://www.globalsecurity.org/wmd/library/news/ukraine/ (the IAEA's update as mirrored there, read);
# `RW ` = https://reliefweb.int/report/ukraine/ (read). Every source was read unless marked (snippet).
# Who did the work (added 8 November 2026, from sides/who_repaired.md, which has every quote): `side` ukrainian
# (Ukrenergo, Energoatom, or the plant's or thermal plant's Ukrainian staff), russian (the plant's staff under Rosatom
# from October 2022, Rosatom crews, Rosseti), both, or unknown; `side_basis` stated (a source names who), implied (the
# organisation's own "we restored", or the IAEA's wording), inferred (from the place alone) or unknown; `worked_on` which
# side of the front, as coarse as the source; `arranged_by` the IAEA's local ceasefire, numbered as the IAEA numbers
# them (the IAEA brokered and watched, it never repaired); `accounts` where the sources disagree (both kept, none
# picked); `side_sources` the sources for who did it. Who did the work is not which side of the front it was on: in
# September-October 2022 the plant's Ukrainian staff repaired on the occupied side (R05a, R05b, R10).

asked: "The user, 5 November 2026, at about 5:18 of the storyboard (zo-night-after): the same map background, circles in the soundscape's style for where crews were sent to fix the lines, accumulated, all the lines, one still frame, zoomed out if need be"
view: {centre_km: [3.0, 5.2], view_km: 40, ground_view_km: 25,
       as: "north up, 40 km wide, exactly the 3D survey's land box east to west (so the old water's mask fills it) (the zoom-out's crossing frame is 25 km: zoomed out so Ferosplavna-1 shows whole, to its substation by Nikopol); the zoom-out's 10 m crop of 28 August 2025 kept on across it"}
how_drawn: >-
  Each repair whose place was published lays one translucent white layer over the area its source names, so the areas
  where crews went again and again are brighter: accumulated. An area along a line is the line's stretch (OpenStreetMap,
  network.json) widened to a band 3 km wide with rounded ends; its sides and banks are those the unrolled film uses (the
  shores of 5 June 2023 and the channel of September 2023, from the 3D survey's water masks: the channel taken as the
  front). The area round the switchyards is a circle round both switchyards' OpenStreetMap outlines, widened by 0.6 km.
  Every edge is dashed: an area, not a point. Drawn, not observed; never a tower, a pin or a crew.
key:
  title: "Where crews were sent to repair the plant's lines · 2022-2026"
  lines: []   # the key box was removed by the user (5 November 2026); its essentials are the note above the credit
  note: "Areas drawn, not observed, each as wide as its source says · + an area's centre, not a place of work"   # the count of repairs, drawn or not, is in its own box above
towns: [Nikopol, Marhanets, Enerhodar]
line_labels: []   # the areas' labels name the lines: no more text (the user: "remove the unnecessary text")

regions:
