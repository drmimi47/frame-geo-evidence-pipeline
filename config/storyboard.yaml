# The film's storyboard: the pool of shots (src/image_evidence/storyboard; started with the user, 2 November 2026).
# The narrative isn't locked: this is everything that could go in, each shot with what it tells and what it still
# needs; the cuts (config/storyboard-cuts.yaml) put some of them in order. A shot leaves a cut by being parked, never
# deleted, so a new story can be cut from the same pool. Add shots freely; keep ids short and stable (the .blend's
# strips are named by them).
#
# status: good (the user's: known good), draft (made, not final), still (a figure, not yet animated), missing (needs
# making or finding), idea (not yet decided), new (made in Blender, not yet described here).
# A shot from a source has `in`/`out` seconds in it; anything else a `duration`. `from`: where it is in the research.
# Evidence rules hold for every shot: inferred never shown as observed, imagery never generated, what is drawn said to
# be. Safety (amended with the user, NEXT.md I5): where lines were damaged or repaired is shown only as a general
# region (a stretch of line or an area at least about 3 km across, as coarse as the source or coarser), never a tower,
# a pin, coordinates or a crew's position; never the Dniprovska substation's place or the trench.

fps: 30                   # the storyboard's (tests); the final film 60
size: [1920, 1080]
labels: true              # each shot's id and status burned into the animatic, top left

