# The Dnipro between Zaporizhzhia and the former Kakhovka reservoir: the front line along the river, the
# shelled right-bank towns (Nikopol, Marhanets, Pokrov), the occupied left bank (Enerhodar, Kamianka-Dniprovska)
# and the drained reservoir bed. Candidates are ranked by how well they can be placed in this area
# (discovery.focus, see focus.py) and only the best are ingested.
# Scope rules still apply: Ukraine only, published 2022-01-01..2026-12-31 (checked per video).

library_dir: library

discovery:
  api_key_env: YOUTUBE_API_KEY
  published_after: 2022-01-01
  published_before: 2026-12-31
  split_by_year: false          # one search per query over the whole range (keeps quota low)
  query_template: "{location} {term}"
  # QUOTA: 17 places x 2 terms + 8 extra + 2 geotag searches = 44 searches x 100 = ~4,400 units (daily quota 10,000)
  locations:
    - name: Запоріжжя
    - name: Балабине
    - name: Кушугум
    - name: Малокатеринівка
    - name: Комишуваха
    - name: Степногірськ
    - name: Нікополь
    - name: Марганець
    - name: Червоногригорівка
    - name: Покров
    - name: Чортомлик
    - name: Нововоронцовка
    - name: Енергодар
    - name: Кам'янка-Дніпровська
    - name: Василівка
    - name: Дніпрорудне
    - name: Велика Знам'янка
  categories:
    - name: aerial
      terms: ["з дрона"]        # drone footage: the most identifiable views of terrain and buildings
    - name: war
      terms: ["обстріл"]        # shelling: the war's effects on the place
  extra_queries:
    - Каховське водосховище дно
    - Каховське водосховище після підриву ГЕС
    - Великий Луг
    - Kakhovka reservoir drone
    - Nikopol shelling
    - Никополь обстрел          # local channels often post in Russian
    - Марганец обстрел
    - Энергодар
  max_results_per_query: 25     # a search costs 100 units whatever it returns, so take more per search
  max_videos_total: 600         # candidates to rank
  max_ingest: 20                # the best-placed new ones are ingested
  focus:
    places: [Запоріжжя, Балабине, Кушугум, Малокатеринівка, Комишуваха, Степногірськ, Приморське, Біленьке,
             Нікополь, Марганець, Червоногригорівка, Покров, Чортомлик, Томаківка, Нововоронцовка,
             Енергодар, Кам'янка-Дніпровська, Водяне, Велика Знам'янка, Василівка, Дніпрорудне,
             Мала Білозерка, Велика Лепетиха, Нова Каховка, Каховка, Берислав]
    radius_km: 15
    geotagged_terms: ["з дрона", "обстріл"]   # videos the uploader geotagged inside the area
    topic_terms: [обстріл, обстрел, приліт, прилет, зруйн, руйнуван, разруш, окупац, оккупац, деокупац, звільн,
                  підрив, взрыв, вибух, каховськ, каховск, водосховищ, водохранилищ, заес, заэс, фронт, shelling,
                  destroyed, occupied, dam, reservoir, frontline]
    min_score: 1.5                # a big city alone in the title (Запоріжжя) is 1.5
  order: relevance
  video_license: any
  video_duration: any
  relevance_language: uk
  safe_search: none

scope:
  min_confidence: 0.5

acquisition:
  policy: public                # same policy as the other ingests
  max_height: 1080
  max_duration_s: 3600
  include_audio: true
  keep_media: false

extraction:
  interval_s: 5
  scene_threshold: 0.3
  min_gap_s: 1.5
  max_frames_per_video: 100
  candidate_pool: 500
  dedup_hamming: 6

classification:
  backend: auto
  prefer: [aerial, drone, architecture, urban, street, infrastructure, industrial, ruins, reconstruction, landscape, wildlife]
  avoid: [people, interior, graphic]
  min_subject: 0.4
