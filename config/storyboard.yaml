  # ---- the film's frame (5 November 2026; research_notes/Forensic film structures/): the cold open, five chapters
  # and a coda as intertitles and the zoom-out's parts that the
  # cut uses apart. The zoom-out's night-light holds are cut out of its record and gathered in the night chapter
  # (the user: the night lights in one chunk); zo-record-begins stays whole in the pool.
  cold-open:
    title: One line of ten, heard before it is seen
    card: |
      11 September 2026

      One of the ten power lines
      of the Zaporizhzhia Nuclear Power Plant
      is connected.
    status: draft
    duration: 8
    tells: "Black, then a single thin voice of the Hum (Ferosplavna-1 alone, the record's last state) under the words: the film starts at its end, heard before it is seen; the full chord of ten comes in chapter I."
    needs: The Hum's single voice cut from the 3D film's last state, over black.
    tags: [opening, sound, ending-rhyme]
  tower-cut:
    title: The tower held, the world around it changing
    status: draft
    source: tower-cut
    in: 0
    out: 24.03
    tells: "People's own views of the region's power lines, smallest to largest, the tower held still while the world around it changes; found footage, aligned. Village poles (Kamianka-Dniprovska 2021, Nikopol in May, the Great Meadow's edge in 2026), then 35-110 kV lattice, the 330 kV towers from below and then whole by the plant, the plant's 750 kV towers, and last the crossing over full water: a 750 kV crossing tower on its caisson filmed from the shore with the thermal plant behind, then the user's photograph of both crossings, held. Silent, a fade from black, hard cuts."
    needs: "Rights: every clip is standard YouTube licence (ask the uploaders); the 750 kV frames are Energoatom's footage inside a news item (Media Poglyad); the 330 kV close-up and the filmed crossing are from one uploader's video of the plant's lines (Valerii Petrenko, June 2023); the crossing photograph's source and rights are unknown (possibly Wikimapia, unconfirmed). A sound decision (silence, or the Hum entering on the crossing)."
