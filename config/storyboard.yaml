  seepage-paper:
    title: The paper's claim, seepage through the dike
    status: still
    source: fig-seepage-paper
    duration: 9
    tells: "Vyshnevskyi and Shevchuk's Figure 11 as published (Sentinel-2A, 5 July 2023, via EarthCache/SkyWatch): the cooling pond's west and north dike, red circles on wet patches at its foot, and their words: 'The satellite images (Figure 11) reveal many places where seepage is taking place.' Between the block opening (the region in 3D) and the sections (the levels in 2D): the claim first, then the film's own test, which finds the pond running down toward 12 m, not a leak. Credited on the frame; the circles said to be the paper's, one image four weeks after the dam (the user, 5 November 2026)."
    needs: "Taylor & Francis's permission before any public screening, or the same Sentinel-2A pass of 5 July 2023 (open data) in its place with the paper's claim quoted; kept out of a public commit."
    from: "NEXT.md S1, the paper (pp. 284-285)"
