    # The lines' record (decided with the user, 22 October 2026): after the lines have landed, the date runs from the
    # invasion and each line goes unlit when it is cut off and lights up again when reconnected; unlit and dotted where
    # lines were cut but the reports don't say which (light means power: the user, 2 November 2026). Every event is a
    # dated report with its sources (checked 22 October 2026). The IAEA names the plant's lines only from late 2022:
    # "the 750 kV line" is Dniprovska (the one 750 kV line left; named by Energoatom on 5 September 2022 and by the IAEA
    # after) and "the 330 kV back-up line" is Ferosplavna-1 (the IAEA's "last functioning back-up line" from 29 December
    # 2022). `count: derived`: the IAEA's number for that complete loss follows from the numbers it gave either side,
    # not stated in the sources found.
    record:
      at_s: 64.5                # the record starts (all lines landed), unless the film's `wait_s` places it
      intro_s: 3                # "before the war" held, then the date runs
      run_s: 155                # 24 February 2022 to `end` (the longer pauses and the zone's moment take the film past 3 minutes; 147 until 2 November 2026, +8 for the night lights held on 5 September 2022)
      outro_s: 5.5              # the last state held, then the fade
      min_hold_s: 0.7           # each state (between reported changes) held at least this long: room to breathe
      min_blink_s: 0.8          # a cut restored within the day shown this long, at the start of its interval
      loss_s: 1.8               # a complete loss within the day: every line off, silent, this long (decided with the user: a longer pause)
      loss_hold_s: 2.4          # a complete loss lasting days at least this long, and longer the longer it lasted:
      loss_day_s: 0.12          # this much a day
      loss_max_s: 6             # up to this (a month on diesel generators)
      fade_off_s: 0.25          # a cut line dims this fast (a breaker)
      fade_on_s: 0.6            # a reconnected line swells back this slowly
      caption_hold_s: 2.0       # a state with a caption held at least this long (read before the next change)
      caption_min_s: 2.0        # and captions at least this far apart: none runs late
      start: 2022-02-24
      end: 2026-09-11           # the last report of the state shown at the end (ANVS, 11 September 2026; the ACA, September 2026)
      lines:                    # record name: [the drawn line's name, kV, strand]; Ferosplavna's two circuits on one row of towers
        Dniprovska: [Dniprovska, 750]
        Zaporizka 750: [Zaporizka, 750]
        Pivdennodonbaska: [Pivdennodonbaska, 750]
        Kakhovska 750: [Kakhovska, 750]
        Ferosplavna-1: ["Ferosplavna 1, 2", 330, 0]
        Ferosplavna-2: ["Ferosplavna 1, 2", 330, 1]
        Zaporizka 330: [Zaporizka, 330]
        Molochanska: [Molochanska, 330]
        Melitopolska: [Melitopolska, 330]
        Kakhovska 330: [Kakhovska, 330]
      groups:
        other 750: [Zaporizka 750, Pivdennodonbaska, Kakhovska 750]
        other 330: [Ferosplavna-2, Zaporizka 330, Molochanska, Melitopolska, Kakhovska 330]
      note: >-
        The IAEA counts ten lines before the war (four 750 kV, six 330 kV); the WNA's chronology says three 330 kV backup
        lines. The six 330 kV lines here are the thermal plant's six circuits as traced; which of them the IAEA counted
        isn't said. The 18th complete loss (June 2026, about 15 hours) isn't dated in the sources found, so the count
        steps from 17 to 19. A trip of Dniprovska in mid-November 2025 (WNA, no date) is left out.
