# Tower cut opener (prototype): footage of power lines round the former Kakhovka reservoir.
# A scratch library: nothing here goes into library/ or libraries/. Scope rules still apply per video
# (Ukraine only, published 2022-01-01..2026-12-31).
library_dir: "research_notes/Tower cut opener/library"

discovery:
  api_key_env: YOUTUBE_API_KEY
  published_after: 2022-01-01
  published_before: 2026-12-31
  split_by_year: false            # one search per query (12 searches, ~1,200 units)
  locations: []
  categories: []
  extra_queries:
    - "ЛЕП Енергодар"
    - "ЛЕП Нікополь"
    - "опори ЛЕП Каховське водосховище"
    - "дно Каховського водосховища дрон"
    - "перехід ЛЕП через Дніпро"
    - "лінія 750 кВ Запорізька"
    - "опора ЛЕП 330 кВ"
    - "Великий Луг дрон"
    - "Марганець Кам'янка-Дніпровська ЛЕП"
    - "високовольтна лінія Запоріжжя дрон"
    - "лінія електропередачі село Запорізька область"
    - "power lines Kakhovka reservoir drone"
  max_results_per_query: 25
  max_videos_total: 300
  order: relevance
  video_license: any
  video_duration: any
  relevance_language: uk
  safe_search: none

scope:
  min_confidence: 0.5

acquisition:
  policy: public
  max_height: 1080
  max_duration_s: 3600
  include_audio: false
  keep_media: true                # keep the download so chosen timestamps can be taken again

extraction:
  interval_s: 3
  scene_threshold: 0.3
  min_gap_s: 1.0
  max_frames_per_video: 100
  candidate_pool: 400
  dedup_hamming: 6
  keep_originals: false

classification:
  backend: auto
  prefer: [infrastructure, landscape, aerial, drone, industrial]
  avoid: [people, interior, graphic, ruins]
  min_subject: 0.3
