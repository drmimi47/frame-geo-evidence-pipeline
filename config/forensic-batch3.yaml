# Batch 3: footage that can be placed. Reportage, frontline and drone videos where someone names where they are,
# with speech or subtitles near the shots (for frame-level clues), showing terrain, rivers, bridges, dams, roads and
# damaged buildings: forensic-architecture style, not scenic montages.
# Candidates are reviewed and the best 10 ingested by id (`evidence ingest-video`) into the main library.
# Scope rules still apply: Ukraine only, published 2022-01-01..2026-12-31 (checked per video).

library_dir: library

discovery:
  api_key_env: YOUTUBE_API_KEY
  published_after: 2022-01-01
  published_before: 2026-12-31
  split_by_year: false          # one search per query over the whole range (keeps quota low)
  # QUOTA: 14 searches x 100 = ~1,400 units (+ a few for video details)
  extra_queries:
    - "Антонівський міст репортаж"
    - "Нова Каховка після підриву ГЕС репортаж"
    - "лівий берег Херсонщини репортаж з човна"
    - "Оскіл водосховище обміліло репортаж"
    - "Ірпінь зруйнований міст репортаж"
    - "Вовчанськ з дрона репортаж"
    - "Часів Яр канал Сіверський Донець - Донбас"
    - "Авдіївка коксохім з дрона"
    - "Бахмут дорога життя репортаж"
    - "Кремінна ліс фронт репортаж"
    - "Енергодар з Нікополя через Дніпро"
    - "Ізюм гора Кременець репортаж"
    - "Ukraine frontline geolocated drone footage"
    - "Ukraine destroyed bridge reporter on the ground"
  max_results_per_query: 8
  max_videos_total: 120         # candidates to review
  order: relevance
  video_license: any            # CC-licensed footage of these places is rare (as in forensic-aerial.yaml)
  video_duration: any
  relevance_language: uk
  safe_search: none

scope:
  min_confidence: 0.5

acquisition:
  policy: public                # same policy as the earlier ingests
  max_height: 1080
  max_duration_s: 3600
  include_audio: true
  keep_media: false
