  water-today:
    title: The record ends; what follows has not happened
    card: |
      11 September 2026. The record ends here.

      What follows has not happened.
      It is what the plans say,
      and the people who study this water.
    status: draft
    duration: 7
    tells: "The turn from the observed to the conditional, after the speculative shot under the crossing: from here on every card is a plan, a proposal, a rate or a claim, each attributed (the report's rule: projected, proposed and claimed are never drawn as observed; no line is relit)."
    from: ZNPP speculative ending and ecology (Draw the future in dashes, outlines and quotes)
    tags: [ending, forest-or-reactor, water, speculative]
  water-wells:
    title: Enough water to keep it cool, not to run it
    card: |
      Since April 2024 the six reactors have been in cold shutdown.
      Wells on the site, about 250 cubic metres an hour,
      keep the fuel cool. They could not run a reactor.

      To run again, the plant would need the river:
      a pumping station of up to 18,000 cubic metres an hour,
      as Russia described one to the IAEA in May 2024,
      enough for one reactor in summer, Bellona estimates,
      or the reservoir back.
    status: draft
    duration: 15
    tells: "Cold shutdown since 13 April 2024 (project rule). The wells (9-11 of them, 200-250 m3/h) cover shutdown cooling by the IAEA's account (WNN, groundwater extraction), 'but not enough to do so if they are restarted' (Beyond Nuclear). Russia's permanent mission to the IAEA, note of 14 May 2024 (INFCIRC/1208): 'up to 5 m3/s (18 000 m3/h)', the pond's average make-up flow, quoted in Bellona 2024 (Gorchakov & Nikitin), p. 23; Bellona: one unit in summer, two to three in winter (p. 24, 41); 11 wells, 250 m3/h, by September 2023 (p. 18, IAEA Update 185). The river pumping station or the rebuilt reservoir are the two published sources of water (Hydropower & Dams)."
    from: ZNPP speculative ending and ecology (If Russia restarts it; corrections table)
    needs: "Replaces the unsourced 'up to 80,000 m3/h'. Greenpeace's ~6,000 m3 a minute not used: twice Bellona's per-unit condenser flow (170,000 m3/h, p. 12). Bellona is a party's analysis (pro-Ukraine NGO): its estimate said as Bellona's."
    tags: [ending, forest-or-reactor, water, restart]
  water-pond:
    title: The cooling pond sinking
    card: |
      Without the reservoir, the plant's cooling pond is sinking.
      Its surface, in metres above sea level:
      16.65 in June 2023, when the dam was destroyed,
      14.34 in September 2024,
      12.27 in October 2026, as Ukraine's military intelligence reports it.

      At about 12 m, by the IAEA's figures, its pumps would stop.
    status: draft
    duration: 13
    tells: "16.65 m, Energoatom's June 2023 monthly average (Bellona 2024, fig. 5, p. 19); levels are heights above sea level (Baltic), not depths. 14.34 m (Sep 2024) from OECD-NEA; 12.27 m (12 Oct 2026) is HUR's, a party's figure, via Euromaidan Press. The ~12 m pump cut-off is implied by the IAEA's 2025 reporting (the isolation dam holds the channel at ~14 m, 'two metres above' where the pumps stop; WNN). Not the reservoir's 12.7 m: two water bodies, never one line. In cold shutdown the wells and sprinkler ponds still cool the fuel, so 12 m is a margin, not a deadline."
    from: ZNPP speculative ending and ecology (If the war goes on)
    needs: "A last check of the pond's level before release (it may be overtaken by a later report); the record ends 11 Sep 2026, so the 12 Oct reading is 'after the record ends'."
    tags: [ending, forest-or-reactor, water]
  water-dam:
    title: Raising the water again
    card: |
      Hydrologists propose a temporary dam
      to raise the water to 12.7 m.
      At that level, they write,
      “both Zaporizhzhya power stations” could run again.

      Ukraine's hydropower company plans the same first step,
      for the fields and the plant's cooling,
      then a new dam: five to six years of building.
    status: draft
    duration: 13
    tells: "Vyshnevskyi & Shevchuk 2024, p. 286: a temporary dam to the dead-volume level of 12.7 m (11.4 km3), at which 'both Zaporizhzhya power stations and Kryvorizka power station... will also be able to operate'; the same 12.7 m as IAEA Update 162's reservoir level. Ukrhydroenergo: a temporary restoration first, to raise the water for irrigation and the plant's cooling, then full reconstruction, 5-6 years to build (7-8 with survey and demolition), $1-1.2 billion (TSN)."
    from: ZNPP speculative ending and ecology (The dam and the plant together)
    needs: "The paper named on screen by authors and year; its pages stay off screen (held locally for reference only)."
    tags: [ending, forest-or-reactor, water, great-meadow]
  point-12:
    title: Point 12, the plant tied to the dam
    card: |
      December 2025. Point 12 of the 20-point peace framework joins
      “control over the Zaporizhzhia Nuclear Power Plant
      and the restoration of the Kakhovka Hydroelectric Power Plant”.

      It was left unresolved.
    status: draft
    duration: 10
    tells: "The 20-point framework (23 December 2025), point 12: the plant and the dam in one point; the US proposed a three-way split, Kyiv a US-Ukraine venture; unresolved (Kyiv Independent; Yale copy of the text). Not the 28-point draft of November 2025, whose point 19 has the plant only, split 50:50, no dam."
    from: Understanding the ZNPP site, next 3; ZNPP speculative ending and ecology (If it returns to Ukraine; corrections table)
    tags: [ending, forest-or-reactor, great-meadow, water]
    needs: "The source on screen (Kyiv Independent, 24 December 2025). Check the quote against the framework's text."
  restart-watch:
    title: Three things before a restart
    card: |
      Before a reactor runs again, Bellona wrote in 2024,
      three things would have to happen.

      A pumping station on the river.
      Rosatom said in June 2025 that it had begun building one.

      A connection to Russia's grid.
      In September 2026 the plant's one line ran to Ukraine's.

      Fresh fuel loaded into a reactor.
      All six reactors are still in cold shutdown.
    status: draft
    duration: 14
    tells: "Bellona's watchlist (Gorchakov and Nikitin, The potential restart of the ZNPP, 2024, p. 42): 'the construction and launch of a new pump station, connection of the ZNPP to the Russian energy grid and fuel reloading in one of the reactors. These are the processes that should be monitored ... and not words and rumors'. The states at the record's end: (1) Likhachev via TASS, 'we have already started construction of a floating modular pumping station', up to 80,000 m3/h (WNN, 9 June 2025; a claim, not seen built; Russia's IAEA mission had described up to 18,000 m3/h in May 2024, INFCIRC/1208, in water-wells); (2) the record's last state, Ferosplavna-1 alone, to the Ferosplavna-1 substation on the Ukrainian-held bank (ANVS, 11 September 2026; ANS, 9 September 2026); (3) all six units in cold shutdown since April 2024 (WNN, 7 August 2026); no reload reported, and Bellona notes one 'cannot pass unnoticed by IAEA inspectors' (p. 39). Text only: nothing drawn as built; Bellona's own forecast ('not before the end of 2024') left out."
    from: Inspiration sources 5 Nov, ZNPP restart report (ideas 1)
    tags: [ending, restart, water]
    needs: "Check each state against the IAEA's updates nearest 11 September 2026 (the pumping station's status after June 2025 is unknown; Rostekhnadzor's licences for units 1 and 2 are not a fuel reload and stay off this card). Overlaps water-wells' pumping-station line."
  forest-or-reactor:
    title: The forest or the reactor
    card: |
      Since June 2023 a forest has grown on the bed:
      willows and poplars up to 9 m tall,
      at least 400 kinds of plant.

      Raised to 12.7 m, the water would cover it
      wherever the bed lies below that level.
    status: draft
    duration: 11
    tells: "The tallest willows measured at study plots, 9 m in October 2026 (Kherson Online; not at the crossing); at least 400 plant species by October 2026 (Moisiienko interview). A forest of the Great Meadow's kind, not the old meadow (Didukh, Soroka). The second sentence is true by definition and claims no area; any drawing of it uses the bed's inferred heights, said so."
    from: ZNPP speculative ending and ecology (The bed's forest is a dated clock; corrections table)
    needs: "Replaces 'a restart would need the water back... would drown the forest' (overstated: a river pumping station is the published alternative, and 12.7 m covers only the lower bed)."
    tags: [ending, forest-or-reactor, great-meadow, water]
  waterline-reprise:
    title: The proposed level, drawn under the crossing
    status: draft
    source: waterline-reprise
    in: 0
    out: 9
    tells: "The same view, the proposed 12.7 m level drawn as a line where the scene's surfaces cross it; proposed level, inferred heights; nothing flooded. Plain for 2 s, then the line fades in round the caisson's foot and across the reeds near the horizon, with a small label (PROPOSED LEVEL · 12.7 M · VYSHNEVSKYI & SHEVCHUK 2024 · THE BED'S HEIGHTS INFERRED). 12.7 m Baltic is 13.1 m in the scene (EGM2008, +0.4 m); the camera's eye is 2.25 m below it. Sound: the line and the near nightingale only, a stretch of the shot's own soundscape."
    from: research_notes/Under the crossing still (v5); ZNPP speculative ending and ecology
    needs: "Whether the line reads at full size (it is about 2 px); the level's datum (Baltic assumed) checked against the paper's page."
    tags: [ending, forest-or-reactor, great-meadow, water, speculative]
  water-voices:
    title: Who wants the water back
    card: |
      “To flood this place again would be another crime,”
      says an ecologist.
      Scientists say the willows hold the old silt's heavy metals in place.

      “I just want there to be water again,”
      says a village head on the old shore.
    status: draft
    duration: 12
    tells: "Nefedov in the Irish Times (21 November 2025); the willows holding the ~83,300 t of heavy metals in the silt, 'scientists say' (Hmarochos, 3 September 2025; no uptake measured; IGB for the tonnage); the Malokaterynivka village head (in the report's sources). Both sides, neither chosen."
    from: ZNPP speculative ending and ecology (Against refilling; the bed is also contaminated)
    needs: "The ecologist's and the village head's full names and the village head's source checked before naming either on screen; reopen both quotes."
    tags: [ending, forest-or-reactor, great-meadow, water]
  water-river:
    title: Another way, from the river
    card: |
      Engineers have proposed another way:
      leave the dam unbuilt, and pump from the river
      for the fields, the towns and the plant's cooling pond.
      Ecologists propose small reservoirs on the tributaries
      and the main channel left open.

      The choice has not been made.
    status: draft
    duration: 12
    tells: "A Ukrainian engineer's 'do not restore' option, with new pumping stations 'including for supplying the cooling reservoir at the Zaporizhzhia nuclear plant' (Hydropower & Dams); Moisiienko's August 2026 compromise, ~200,000 of the former 215,000 ha left wild, ~15,000 ha of small reservoirs on tributaries, 'we won't block the main channel' (Intent). So the forest and a restart are not strictly exclusive."
    from: ZNPP speculative ending and ecology (Against refilling)
    tags: [ending, forest-or-reactor, great-meadow, water]
  water-last:
    title: Tied to the water
    card: |
      The lines carried the plant's power out.
      Now they carry a trickle in, to keep it safe.

      Its future is tied to the water,
      and the water's, to the forest.
    status: draft
    duration: 9
    tells: "The film's own reflection, not a source's: the lines built to carry gigawatts out carry 11-50 MW in for the plant's own needs (Energoatom via Interfax-Ukraine, Ukrainska Pravda); the plant's water and the forest's ground are the same water. Then 'One line of ten' returns to the observed."
    from: ZNPP speculative ending and ecology (Conclusion)
    tags: [ending, forest-or-reactor, water]
