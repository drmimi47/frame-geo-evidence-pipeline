        from: 2022-09-06
        until: 2023-03-30
        around: [28877213]      # OSM way: Запорізька АЕС (power=plant), the plant's site
        label: "IAEA protection zone: proposed, never agreed"
        hold_s: 9               # the held moment (decided with the user): the date holds while the camera closes in on
        view_km: 11             # the circle at its true size (this frame width), holds, and pulls back out as a ring
