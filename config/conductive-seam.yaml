# The Conductive Seam: satellite imagery along the power lines of the Zaporizhzhia power plants, across the former
# Kakhovka reservoir (`evidence satellite`, the site's Satellite panel and The Conductive Seam view).
# Each area becomes a corridor once (its box, lines and grid are then fixed: satellite/corridors/<id>/georef.json);
# passes of any date and sensor are laid on that same grid. Saved in the "The Conductive Seam" evidence folder.

areas:
  # The test area: the 330 kV double line Л-243/Л-244 from the Zaporizhzhia thermal power plant (Enerhodar) north
  # across the former reservoir to the Nikopol bank, with six crossing towers that stood in the water. The 750 kV
  # line from the nuclear plant runs north just west of it (inside the box, drawn as context).
  enerhodar-crossing:
    name: Enerhodar Dnipro crossing (test)
    bbox: [34.56, 47.47, 34.73, 47.63]   # west, south, east, north: ≥ 3.5 km round the line, so a turned
                                         # 6 km frame stays on the imagery
    lines: [265670105, 143488526]        # OpenStreetMap ways, joined end to end: ZTPP → 47.539 N → north bank
    m_per_px: 10
    chip_size_m: 3000
    chip_spacing_m: 1500

  # The Great Meadow's north bank: the same 330 kV line from the Zaporizhzhia thermal plant (Enerhodar) across the
  # former reservoir, then on along the north bank, across the river from the nuclear plant, to the Dnipro dam at
  # Zaporizhzhia (Дніпро І ГЕС): 330 kV all the way, joined through the Ferosplavna and Nikopolska substations. At
  # Nikopolska-330 the line turns back east (Л-211), so the camera turns round there and passes Chervonohryhorivka a
  # second time a few km inland. (The lines that run from Enerhodar straight to Zaporizhzhia, 750 kV and Л-242, go
  # south round the left bank, away from the meadow.)
  great-meadow:
    name: Enerhodar → DniproHES, Great Meadow
    bbox: [34.26, 47.47, 35.14, 47.91]
    lines: [265670105, 143488526, 265670135, 143495706, 303336697]   # Л-243/Л-244, north bank, Nikopolska, Л-211
    join_m: 1500           # through a substation, one line's end and the next one's start can be far apart
    strip_m: 6500          # imagery within 6.5 km of the line (a 10 km frame, turned, stays on it)
    chip_size_m: 4000
    chip_spacing_m: 5000
    film:
      dissolve_at_km: [5.2]   # the crossing: 5 June 2023 (the reservoir full) to after it drained, at the inset
      trace: true             # 110 km of line at 10 m imagery: drawn (red), so it can be followed
      opening:                # before the line: a fade in on the nuclear plant, its lines drawn out from it in red
        plant: 28877213       # OpenStreetMap way: Запорізька АЕС (the frame's middle)
        box: [34.50, 47.44, 34.72, 47.58]   # the plants' surroundings (raw/osm_opening.json: plants, switchyards, lines)
        view_m: 7600          # the frame's width on the plant (the June pass has no imagery 4 km west of it)
        fade_s: 3
        hold_s: 12            # the frame held while the plant's lines draw out
        pan_s: 8              # then across to the line's start (the thermal plant's 330 kV lines drawn on the way),
                              # zooming to the track's width; the other lines fade out as the track begins
        names: >-
          the ways' own OpenStreetMap tags (ref, from, to; Kakhovska 750 kV by its name); the unnamed 750 kV ways by
          Bellona's map of the plant's lines (four 750 kV, six 330 kV; Bellona, "Potential Restart of the Zaporizhzhia
          Nuclear Power Plant", 2024) and where they end; 187125189 carries Л-247 and Л-241 (two circuits) to where
          they part
        origins:              # where branches start: OpenStreetMap ways (their middle)
          npp: 28877213       # the plant
          npp750: 28877226    # its 750 kV switchyard
          tpp330: 28877449    # the thermal plant's 330 kV switchyard
        sites:
          - {osm: 28877213, text: Zaporizhzhia NPP}
          - {osm: 28877239, text: Zaporizhzhia TPP}
        branches:             # OpenStreetMap ways, drawn out from `from` from start_s (s into the opening) over draw_s
          - {ways: [143603531], from: npp, kv: 750, start_s: 3.0, draw_s: 2, reach_m: 1800}   # the units to the switchyard
          - {ways: [143603538], from: npp, kv: 750, start_s: 3.2, draw_s: 2, reach_m: 1800}
          - {ways: [143603545], from: npp, kv: 750, start_s: 3.4, draw_s: 2, reach_m: 1800}
          - {ways: [143603547], from: npp, kv: 750, start_s: 3.6, draw_s: 2, reach_m: 1800}
          - {ways: [143603549], from: npp, kv: 750, start_s: 3.8, draw_s: 2, reach_m: 1800}
          - {ways: [143603551], from: npp, kv: 750, start_s: 4.0, draw_s: 2, reach_m: 1800}
          - {ways: [790736604], from: npp750, kv: 750, start_s: 5.5, label: 750 kV · Dniprovska, label_m: 3200}
          - {ways: [143926899], from: npp750, kv: 750, start_s: 5.8, label: 750 kV · Zaporizka, label_m: 1300}
          - {ways: [143519988], from: npp750, kv: 750, start_s: 6.1, label: 750 kV · Pivdennodonbaska, label_m: 1600}
          - {ways: [316571510], from: npp750, kv: 750, start_s: 6.4, label: 750 kV · Kakhovska, label_m: 1300, side: left}
          - {ways: [155275704], from: npp, kv: 330, start_s: 6.0, draw_s: 4, reach_m: 4500, label: 330 kV · to the TPP switchyard, label_m: 2000}
          - {ways: [155276120], from: npp, kv: 330, start_s: 6.2, draw_s: 4, reach_m: 4500}
          - {ways: [187022455], from: tpp330, kv: 330, start_s: 13.0, label: 330 kV · Zaporizka (Л-242), label_m: 1500}
          - {ways: [711002169], from: tpp330, kv: 330, start_s: 13.3, label: 330 kV · Molochanska (Л-246), label_m: 2300}
          - {ways: [187125189], from: tpp330, kv: 330, start_s: 13.6, label: "330 kV · Melitopolska, Kakhovska (Л-247, Л-241)", label_m: 3100}
        line: {start_s: 12.5, kv: 330, label: 330 kV · Ferosplavna 1 and 2 (Л-243/Л-244), label_m: 1800}   # the corridor's own
      insets:                 # supplied images laid on the passes (in the corridor's insets/ folder, as given)
        - image: crossing-pylons.png
          title: WorldView-2 · 23 August 2024 · Esri World Imagery
          credit: Esri, Vantor, Earthstar Geographics, and the GIS User Community
          source: >-
            a screenshot of Esri World Imagery supplied by the user; Esri's metadata there (crossing-pylons.esri-metadata.json):
            WorldView-2, 23 August 2024, 0.5 m, Vantor; the screenshot matches Esri's imagery of the same extent
          pins:               # image pixel -> OpenStreetMap tower (the corridor's saved Overpass reply)
            - {px: [674, 893], osm_node: 1570098588, label: 330 kV Л-243/Л-244}
            - {px: [1462, 512], osm_node: 1570098077, label: 750 kV}
          crop: [330, 230, 1780, 1150]   # x0, y0, x1, y1: smaller than the frame, so it reads as an image on the map
          at_km: 5.2          # where the camera stops (the image's middle, along the line)
          view_m: 1600        # the frame's width there
          zoom_in_m: 800      # the camera zooms in over the last 800 m (from about 0:37) and out over the next 900
          zoom_out_m: 900
          hold_s: 10
      profile:                # km along the line: speed (m a second) and the frame's width (m)
        - {km: 0, speed_mps: 150, view_m: 6000}
        - {km: 9, speed_mps: 150, view_m: 6000}
        - {km: 15, speed_mps: 550, view_m: 10000}
        - {km: 35, speed_mps: 550, view_m: 10000}
        - {km: 39, speed_mps: 450, view_m: 6000}   # the turn at Nikopolska-330, 4 km from the box's west edge:
        - {km: 46, speed_mps: 450, view_m: 6000}   # a narrower frame, turned, stays on the imagery
        - {km: 50, speed_mps: 550, view_m: 10000}
        - {km: 67.6, speed_mps: 550, view_m: 10000}
        - {km: 69.8, speed_mps: 550, view_m: 4000}   # 3:30 to 4:30 closer in on the line (decided with the user):
        - {km: 103, speed_mps: 550, view_m: 4000}    # same path and speed, a narrower frame
        - {km: 110, speed_mps: 200, view_m: 7000}
      hold_s: 9               # the last hold (the credits), its last 3.5 s fading to black
      fade_out_s: 3.5
      # Notes under the film (the view shows them; satellite/notes.py): context from the sources given with each, never
      # read from the imagery. `from`/`to`: {shot: open|pan|track|dissolve|inset|hold, s: seconds into it (negative: from
      # its end), n: which one (-1 the last)} or {km: along the line}; a note runs until the next unless `to` is given.
      # Checked against the sources on 19 October 2026. Re-place without rendering: evidence satellite notes --area great-meadow
      notes:
        - from: {shot: open, s: 1.5}
          text: >-
            Zaporizhzhia Nuclear Power Plant (ZNPP): six reactors, the largest nuclear plant in Europe.
          sources:
            - {title: Wikipedia, url: "https://en.wikipedia.org/wiki/Zaporizhzhia_Nuclear_Power_Plant"}
        - from: {shot: open, s: 6.5}
          text: >-
            Before the war, ten lines linked it to the grid: four at 750 kV, and six at 330 kV from the switchyard of the
            thermal plant beside it.
          sources:
            - {title: "IAEA, Update 345", url: "https://reliefweb.int/report/ukraine/update-345-iaea-director-general-statement-situation-ukraine"}
        - from: {shot: pan, s: 3}
          text: >-
            Russian forces seized the plant on 4 March 2022. It has sent no power to the grid since September 2022, and
            all six reactors have been in cold shutdown since April 2024.
          sources:
            - {title: Wikipedia, url: "https://en.wikipedia.org/wiki/Zaporizhzhia_Nuclear_Power_Plant"}
            - {title: "Ukrinform (IAEA), April 2024", url: "https://ukrinform.net/rubric-economy/3852084-all-reactors-at-zaporizhzhia-npp-in-cold-shutdown-for-first-time-since-2022-iaea.html"}
        - from: {km: 0.9}
          text: >-
            The red line is Ferosplavna: in fact two 330 kV lines on one row of towers, Л-243 and Л-244, running north from
            the thermal plant in occupied Enerhodar.
          sources:
            - {title: "OpenStreetMap, way 265670105", url: "https://www.openstreetmap.org/way/265670105"}
        - from: {km: 2.6}        # 0:39: the line leaving Enerhodar
          text: >-
            Before the war, the plant's power flowed out along lines like this one into Ukraine's grid. Since it stopped
            supplying the grid in September 2022 the flow runs the other way: the grid sends power in.
          sources:
            - {title: "RFE/RL, December 2023", url: "https://www.rferl.org/a/zaporizhzhya-nuclear-power-plant-safety-ukraine/32711212.html"}
            - {title: "Ukrainska Pravda, January 2026", url: "https://www.pravda.com.ua/eng/news/2026/01/18/8016739"}
        - from: {shot: dissolve, s: 0}
          text: >-
            On 6 June 2023 the Kakhovka dam, downstream, was destroyed and the reservoir drained. Here: 5 June, then
            8 September 2023.
          sources:
            - {title: Wikipedia, url: "https://en.wikipedia.org/wiki/Destruction_of_the_Kakhovka_Dam"}
        - from: {shot: inset, s: 1.5}
          text: >-
            At half a metre a pixel the towers show: a 750 kV line and Ferosplavna's 330 kV, standing on the drained
            reservoir bed.
          sources:
            - {title: Esri World Imagery, url: "https://www.arcgis.com/home/item.html?id=10df2279f9684e4a9f6a7f08febac2a9"}
        - from: {shot: track, n: 2, s: 0}   # 1:14: leaving the inset
          text: >-
            Why power must flow in: shut-down fuel still gives off heat, and the pumps that carry it away run on
            electricity. At Fukushima in 2011, a total loss of power led to three meltdowns.
          sources:
            - {title: "RFE/RL, December 2023", url: "https://www.rferl.org/a/zaporizhzhya-nuclear-power-plant-safety-ukraine/32711212.html"}
            - {title: "Wikipedia, Fukushima nuclear accident", url: "https://en.wikipedia.org/wiki/Fukushima_nuclear_accident"}
        - from: {km: 7}          # 1:27: over the drained bed
          text: >-
            The plant drew its cooling water from this reservoir. Since it drained, wells keep the reactors' sprinkler
            ponds filled.
          sources:
            - {title: "NEI Magazine (IAEA), September 2023", url: "https://www.neimagazine.com/news/more-wells-drilled-at-zaporizhia-npp-11160730/"}
        - from: {km: 8.5}
          text: >-
            On 25 August 2022 fires near the plant cut its lines: for the first time in its history it was cut off from the
            grid. IAEA experts arrived on 1 September and have stayed.
          sources:
            - {title: "Al Jazeera, 25 August 2022", url: "https://www.aljazeera.com/news/2022/8/25/ukraine-says-zaporizhzhia-nuclear-plant-disconnected-from-grid"}
            - {title: "CNN, September 2022", url: "https://abc17news.com/news/national-world/cnn-europe-mideast-africa/2022/09/04/zaporizhzhia-nuclear-plant-loses-main-connection-to-power-grid-again/"}
        - from: {km: 11}         # 1:51
          text: >-
            When the last line fails, 20 diesel generators take over, with about ten days of fuel kept on site. Cold
            shutdown leaves several days' margin if the cooling stops.
          sources:
            - {title: "RFE/RL, December 2023", url: "https://www.rferl.org/a/zaporizhzhya-nuclear-power-plant-safety-ukraine/32711212.html"}
            - {title: "Euromaidan Press, September 2026", url: "https://euromaidanpress.com/2026/09/07/russia-burns-occupied-zaporizhzhia-nuclear-plants-last-resort-generators-as-everyday-power-ukraine-says/"}
            - {title: "Ukrinform (IAEA), April 2024", url: "https://ukrinform.net/rubric-economy/3852084-all-reactors-at-zaporizhzhia-npp-in-cold-shutdown-for-first-time-since-2022-iaea.html"}
        - from: {km: 17}         # 2:05
          text: >-
            On 23 September 2025 its last line was cut. It ran on diesel generators for a month, until repairs under local
            ceasefires brokered by the IAEA.
          sources:
            - {title: "AP, 23 October 2025", url: "https://www.yahoo.com/news/articles/off-power-being-restored-ukraine-104314844.html"}
        - from: {km: 24}
          text: >-
            Marhanets and Nikopol, on this bank, are held by Ukraine and face the plant across the water. Rockets fired from
            the direction of Enerhodar began hitting Nikopol in August 2022.
          sources:
            - {title: "CBC (AP), August 2022", url: "https://www.cbc.ca/lite/story/1.6540764"}
        - from: {km: 31}         # 2:33: the line reaches its substation (km 32.5)
          text: >-
            Here Ferosplavna-1 ends, at the Ferosplavna-330 substation. Of the plant's ten lines, two are left: this one,
            its backup, and the 750 kV Dniprovska, its main line.
          sources:
            - {title: "OpenStreetMap, way 265670105", url: "https://www.openstreetmap.org/way/265670105"}
            - {title: "Babel, 2026", url: "https://babel.ua/en/news/124384-repairs-to-the-backup-power-line-at-the-zaporizhzhia-npp-began-after-agreements"}
        - from: {km: 38}
          text: >-
            At Nikopol the route turns onto Л-211, a 330 kV line running east toward Zaporizhzhia: the grid the plant once
            fed.
          sources:
            - {title: "OpenStreetMap, way 303336697", url: "https://www.openstreetmap.org/way/303336697"}
        - from: {km: 50}       # 3:18: the drained bed comes into view on the right (south)
          text: >-
            To the right, south of the line, lay the Great Meadow (Velykyi Luh): the Dnipro's floodplain of grassland and
            marsh, rich in Cossack history, flooded by the Kakhovka reservoir in the 1950s.
          sources:
            - {title: "Yale e360, October 2024", url: "https://e360.yale.edu/features/ukraine-war-wilding"}
        - from: {km: 56}       # 3:29: the bed still on the right
          text: >-
            Since the reservoir drained in 2023, native willows have grown across its floor: researchers call the young
            forest Europe's largest floodplain forest.
          sources:
            - {title: "Yale e360, October 2024", url: "https://e360.yale.edu/features/ukraine-war-wilding"}
        - from: {km: 64}       # 3:43: the line over farmland on the north bank, the bed out of frame
          text: >-
            Why trace the line: the plant is on the occupied bank, but the power that keeps its reactors cooled comes from
            this side of the front. Every repair needs work, and a ceasefire, on both sides.
          sources:
            - {title: "AP, 23 October 2025", url: "https://www.yahoo.com/news/articles/off-power-being-restored-ukraine-104314844.html"}
            - {title: "Komersant, October 2025", url: "https://komersant.ua/en/zaes-znovu-pidkliuchat-do-elektromerezhi-mahate-rozpochalo-protses"}
        - from: {km: 76}       # 4:05
          text: >-
            Lines can also lead to another grid: in 2025 Ukraine protested to the IAEA that Russia was building power
            lines in the occupied south to connect the plant to Russia's grid and restart it.
          sources:
            - {title: "Yahoo News, 2025", url: "https://www.yahoo.com/news/ukraine-protests-iaea-over-russia-112557454.html"}
            - {title: "LIGA.net, 2025", url: "https://news.liga.net/en/politics/news/siberia-russia-wants-to-connect-znpp-to-its-power-grid-and-involve-the-iaea"}
        - from: {km: 88}       # 4:27
          text: >-
            On 10 February 2026 shelling cut Ferosplavna-1 at the thermal plant's switchyard, where this line begins. For 23
            days the plant hung on Dniprovska alone, until repairs under a ceasefire reconnected it on 5 March.
          sources:
            - {title: "NEI Magazine, March 2026", url: "https://www.neimagazine.com/?p=102910"}
            - {title: "IAEA, Update 345", url: "https://reliefweb.int/report/ukraine/update-345-iaea-director-general-statement-situation-ukraine"}
        - from: {km: 100}      # 4:49: Zaporizhzhia's outskirts
          text: >-
            Zaporizhzhia, the oblast's capital, held by Ukraine. The plant, in the same oblast but occupied, is about
            55 km away in a straight line.
          sources:
            - {title: Wikipedia, url: "https://en.wikipedia.org/wiki/Zaporizhzhia"}
        - from: {km: 108.5}    # 5:08: the dam comes into view
          text: >-
            DniproHES, the dam at the head of the old Kakhovka reservoir, the water that drowned the Great Meadow. Russian
            missiles hit it on 22 March 2024, badly damaging its power stations.
          sources:
            - {title: "Wikipedia, Kakhovka Reservoir", url: "https://en.wikipedia.org/wiki/Kakhovka_Reservoir"}
            - {title: "Euromaidan Press, 22 March 2024", url: "https://euromaidanpress.com/2024/03/22/dnipro-hydroelectric-plant-out-of-service-after-russian-missile-attack/"}
        - from: {shot: hold, n: -1, s: 0}   # 5:19: the last hold, the credits
          text: >-
            On 20 August 2026 it lost its last line again, the IAEA's 26th count: almost three weeks on diesel, down to two
            generators, before repairs.
          sources:
            - {title: "ANS, 9 September 2026", url: "https://www.ans.org/news/2026-09-09/article-8377/zaporizhzhia-restores-offsite-power-following-iaeabrokered-local-ceasefire/"}
            - {title: "Euromaidan Press, September 2026", url: "https://euromaidanpress.com/2026/09/07/russia-burns-occupied-zaporizhzhia-nuclear-plants-last-resort-generators-as-everyday-power-ukraine-says/"}

  # Another corridor is added the same way (a new id: an existing corridor's box and lines never change), e.g. the
  # 750 kV line from the nuclear plant north to Dniprovska-750:
  # znpp-750-north:
  #   name: ZNPP 750 kV, north across the reservoir
  #   bbox: [34.00, 47.45, 34.75, 48.50]
  #   lines: [790736604, 375110029, 375440092, 375440078]
  #   join_m: 1500
  #   strip_m: 6500

fetch:
  sensor: sentinel-2
  start: 2023-07-01      # after the dam's destruction (6 June 2023): the bed exposed
  end: 2023-09-30
  max_cloud: 5           # % of each tile, by the provider; checked again over the corridor itself

film:
  width: 1920
  height: 1080
  fps: 24
  view_m: 6000           # ground width of the frame
  speed_mps: 150         # ground metres travelled per second of film
  hold_s: 6              # still at the start and the end
  ease_s: 3              # the camera eases in and out of a move
  dissolve_s: 6          # between two passes, at a held position
  orient: travel         # travel: the way along the line points up; north: north up
  caption: true          # sensor and date, small, on the holds and dissolves
  trace: false           # the OSM line as a hairline (an overlay, labelled in film.json)

# A plant's lines as a network (`network.py`, `zoomout.py`; decided with the user, 21 October 2026): the plant at the
# centre, the camera pulling back while every line from it grows outward to the substation where it ends.
networks:
  znpp:
    name: The Zaporizhzhia NPP's lines
    plant: {osm: 28877213, label: Zaporizhzhia NPP}           # OpenStreetMap way: Запорізька АЕС
    origins: {npp750: 28877226, tpp330: 28877449}               # the plant's 750 kV switchyard; the thermal plant's 330 kV
    bbox: [32.0, 45.9, 38.6, 49.2]                              # where the lines are looked for (Overpass)
    voltages_kv: [750, 330]
    # the weather at the crossing, for the Hum's wet swell (hum.py `weather`, the user, 9 November 2026): ERA5 hourly from
    # Open-Meteo's archive, saved verbatim (weather/provenance.json); relative to the network's folder
    weather: {era5: weather/era5_crossing_2022-02-24_2026-09-11.json, cell: [47.5, 34.5], source: "ERA5 reanalysis (Copernicus C3S) via Open-Meteo's archive, the 0.25 degree cell at 47.5 N 34.5 E, hourly"}
    # Each line: the ways it starts with (out of its switchyard, or the shared towers before it branches), then traced
    # to the substation it must reach (`to`, the OSM name; anything else is refused). Names by destination, as the
    # IAEA and the user's reference image name them. Checked 21 October 2026: Kakhovska 750 is 186 km officially
    # (UNIAN, opened 23 December 2020), 185.2 km traced.
    lines:
      - {name: Dniprovska, kv: 750, from: npp750, start: [790736604], to: Дніпровська-750}
      - {name: Zaporizka, kv: 750, from: npp750, start: [143926899], to: Запорізька-750}
      - {name: Pivdennodonbaska, kv: 750, from: npp750, start: [143519988], to: Південнодонбаська-750}
      - {name: Kakhovska, kv: 750, from: npp750, start: [316571510], to: Каховська-750, checked: "186 km officially (UNIAN, 23 December 2020)"}
      - {name: "Ferosplavna 1, 2", kv: 330, ref: Л-243/Л-244, from: tpp330, start: [265670105], to: Феросплавна-330}
      - {name: Zaporizka, kv: 330, ref: Л-242, from: tpp330, start: [187022455], to: Запорізька-330}
      - {name: Molochanska, kv: 330, ref: Л-246, from: tpp330, start: [711002169], to: Молочанська-330}
      - {name: Melitopolska, kv: 330, ref: Л-247, from: tpp330, start: [187125189, 139080271], to: Мелітопольська-330}
      - {name: Kakhovska, kv: 330, ref: Л-241, from: tpp330, start: [187125189, 277659555], to: Каховська-330}
    links: [155275704, 155276120]                               # 330 kV between the plant and the thermal plant's switchyard
    feeds: [143603547, 143603545, 143603551, 143603531, 143603549, 143603538]   # 750 kV, units 1-6 into the plant's 750 kV switchyard
    units: [28877253, 28888414, 28888415, 28888416, 28888417, 28888418]   # power=generator: units 1-6, outlined
    areas:   # OSM relation 1600087 is the former Kakhovka reservoir (old_name), mapped since its drainage as the wetland
             # Великий Луг: its whole bed, down to the dam; historically the Great Meadow is its upper reach
      - {osm_relation: 1600087, label: Great Meadow, label_local: Великий Луг, label_at: [35.07, 47.66], min_km2: 2,
         note: "OpenStreetMap's Великий Луг (relation 1600087): the drained Kakhovka reservoir's bed as mapped (its old_name)"}
    imagery:  # the close-up on top, the wider pass under it: Sentinel-2 all the way out (decided with the user)
      # before: a pre-war pass (decided with the user, 22 October 2026), shown until the record reaches the dam's
      # destruction (`film.imagery_switch`); 8 September 2021 is the clearest summer 2021 pass covering both boxes in
      # one overpass (cloud at most 1.7% a tile), near the later pass's season. after: the drained reservoir as it is.
      - {name: close_2021, era: before, sensor: sentinel-2, start: 2021-09-08, end: 2021-09-08, max_cloud: 5, box_km: [26, 15], m_per_px: 10}
      - {name: wide_2021, era: before, sensor: sentinel-2, start: 2021-09-08, end: 2021-09-08, max_cloud: 5, box_km: [180, 102], m_per_px: 60}
      # the crossing (decided with the user, 22 October 2026): the camera closes in on the Dnipro crossing after the
      # dissolve, so the later pass's close-up is round it (centre_km: m east and north of the plant), shown below 30 km
      - {name: crossing, era: after, sensor: sentinel-2, start: 2025-08-28, end: 2025-08-28, max_cloud: 5, box_km: [40, 24], centre_km: [3, 4.5], m_per_px: 10, fade_km: [30, 44]}
      - {name: wide_s2, era: after, sensor: sentinel-2, start: 2025-08-28, end: 2025-08-28, max_cloud: 5, box_km: [180, 102], m_per_px: 60}   # the close-up's pass
    film:
      title: ZNPP-ten-lines-zoom-out   # the film's file name, <title>.mp4 (the user, 2 November 2026)
      size: [1920, 1080]
      fps: 60                   # smooth growth and zoom (the final render; tests at 30: --fps 30)
      line_rgb: {750: [255, 214, 0], 330: [240, 156, 0]}   # two yellows, apart from the rivers (decided with the user): 750 kV the brighter
      start_view_km: 2.2        # the frame's width on the six units (centred on them)
      yards_view_km: 5.6        # then out to both switchyards while the plant's own lines are drawn into them
      yards_zoom_s: [6.8, 11.5]
      feeds_at_s: 7.4           # each unit's line into the 750 kV switchyard, one after another
      links_at_s: 10.8          # then the links to the thermal plant's 330 kV switchyard
      origin_labels: {npp750: 750 kV switchyard, tpp330: "Thermal plant · 330 kV switchyard"}
      plant_centre_km: 30       # the camera's centre is on the plant once the frame is this wide
      label_zone: [0.86, 0.84]  # a line's name rides its tip while the tip is inside this share of the frame, then stays
      end_view_km: 470          # the lines' frame: every line's end inside (the lines grow at its pace)
      max_view_km: 172          # the camera eases into this and stays (the Dnipro and the Great Meadow framed); the lines grow on off it
      view_cap_soft: 0.25       # how gently it eases in (log scale)
      meadow_close_m: 500       # the Great Meadow's shore: channel inlets narrower than 1 km closed
      fade_in_s: 2.5
      hold_s: 14.5              # the units outlined, then their lines into the switchyards, before the lines leave
      zoom_lead_s: 1.5          # the camera starts pulling back this long before the lines leave
      close_fade_km: [11, 19]   # the sharp close-up gives way to the wider pass between these frame widths
      grow_s: 46                # all lines start together at one speed; the longest lands last
      accel: 3.2                # how much the speed builds (an exponential start: the zoom reads as steady)
      end_hold_s: 8
      fade_out_s: 2.5
      margin: 1.22              # the frame keeps the growing tips this far inside
      imagery_fade_km: null     # Sentinel-2 all the way out (decided with the user): no dark ground
      imagery_switch: {at: 2023-06-06, dissolve_s: 3}   # the pre-war pass until the record reaches the dam's destruction, then a dissolve to the later one
      imagery_gain: 0.8         # the imagery a little darker, so the lines stand out (decided with the user)
      wait_s: 13                # the full chord heard this long before the war (decided with the user: 10 s; 13 since 2 November 2026, room for the night lights before it): the record starts then
      hum: {seed: 50, fade_in_s: 4}   # the Hum (hum.py, decided with the user): synthesized; all ten lines fade in once the camera settles
      loss_dim: 0.7             # the imagery dims a little more during a complete loss of off-site power (every line off)
      night_lights:             # the ground at night at three held moments: before, during, after (the user, 2 November 2026; NEXT.md N2)
        dir: satellite/nightlights/blackmarble/frame_VNP46A3   # in the Conductive Seam folder: VNP46A3 crops of the 172 km frame (provenance.json there)
        product: {name: "NASA Black Marble VNP46A3 (Suomi NPP VIIRS Day/Night Band), Collection 2, monthly", doi: 10.5067/VIIRS/VNP46A3.002,
                  url: "https://ladsweb.modaps.eosdis.nasa.gov/missions-and-measurements/products/VNP46A3/"}
        day_a: 0.22             # the daylight pass kept as a faint map under the lights
        top: 60                 # nW/cm²/sr shown at full white (log scale)
        fade_s: 1.2
        # September each time: the same season, no snow, the pre-war one the month of the film's pre-war pass. Brightness
        # is not electricity: `why` gives a reason only where a source does (research_notes/Night lights test/README.md)
        moments:
          - {month: 2021-09, at: before, hold_s: 5, title: "September 2021, before the war", why: "Both banks lit"}
          - {month: 2022-09, at: 2022-09-05, hold_s: 5, title: September 2022,
             why: "Nikopol's bank dark, the occupied bank lit · The satellite shows where it was dark, not why"}
          - {month: 2026-09, at: end, pull_s: 7, hold_s: 7, title: September 2026, src: [moscow_times_2026_07_31],
             why: "The occupied bank dark too · Strikes on substations there cut power to nearly a million people (Moscow Times, July 2026)"}
        sources:
          moscow_times_2026_07_31: {title: "Ukrainian drone strikes cut power to nearly 1m people in occupied regions (The Moscow Times, 31 July 2026)",
                                    url: "https://www.themoscowtimes.com/2026/07/31/ukrainian-drone-strikes-cut-power-to-nearly-1m-people-in-occupied-regions"}
      # once the imagery has dissolved to the drained bed, the camera closes in on the Dnipro crossing (decided with the
      # user, 22 October 2026): the plant at the bottom, Dniprovska and Ferosplavna-1 across the bed to the Nikopol bank
      crossing:
        view_km: 25
        centre_km: [3, 4.5]     # m east and north of the plant
        after_s: 1              # after the dissolve ends
        push_s: 18
        labels:                 # each named where it crosses the drained bed, with its state; the notes as the IAEA names them
          - {line: Dniprovska, at_km: 10, side: right, note: the last 750 kV line}
          - {line: Ferosplavna-1, name: Ferosplavna-1, at_km: 7.5, side: left, note: the 330 kV backup line}
      # workers: 6              # parts drawn at once (default: three in four cores)
    # The crossing in 3D (docs/crossing-3d-plan.txt, planned with the user 25 October 2026): from the zone's close-up the
    # map tilts and the camera flies north between the last two lines over the water to the Nikopol bank.
    # `evidence satellite crossing3d --pass survey` (pass 0): the two lines, their towers, the water, the flight path.
    crossing3d:
      lines: [Dniprovska, "Ferosplavna 1, 2"]   # network.json names (Ferosplavna's two circuits share one row of towers)
      towers_from: great-meadow   # the corridor whose saved Overpass reply holds the towers (power=tower nodes)
      water_passes: [s2a_20230605T0836, s2b_20230908T0836]   # on that corridor's grid: the day before the dam broke, and after
      window_km: [-1.5, 27]       # m north of the plant (km): what the survey looks at; the lines drawn on to the
                                  # land's northern edge, into the haze (the user, 26 October 2026: Dniprovska runs on
                                  # north to the grid, not ending at the shore)
      flight_until_km: 9.0        # the flight path runs from where the lines cross to here (both turn on the north bank)
      # pass 1, the grey-box camera animatic (`--pass animatic`): FABDEM land under the pre-war pass, towers as boxes at
      # their OSM positions (heights placeholders until pass 4), wires straight between them
      texture: {name: c3d_2021_09, era: before, sensor: sentinel-2, start: 2021-09-08, end: 2021-09-08, max_cloud: 5, box_km: [40, 36], centre_km: [3, 10.5], m_per_px: 10}
      # pass 3, the bed (bed.py; the user, 26 October 2026: "build the bed's shape from 1940s-50s maps, realistic water
      # level drop, and exposed powerline foundations"). No elevation model of the drained bed exists: its heights are
      # inferred from where the water was on each pass after the breach and the level reported then (the waterline
      # method), held to ICESat-2's measured ground and the 1941 sheet's spot heights. Heights: m above EGM2008.
      bed:
        grid_of: {name: crossing_2021, era: before, sensor: sentinel-2, start: 2021-09-08, end: 2021-09-08, max_cloud: 5, box_km: [40, 24], centre_km: [3, 4.5], m_per_px: 10}   # the reservoir round the crossing: the bed's box
        m_per_px: 20
        observe: {start: 2023-06-01, end: 2023-09-10, max_cloud: 35, skip_platforms: [landsat-7],
                  also: [2023-06-20, 2023-08-19, 2024-08-23, 2025-08-28],   # the texture layers' days: their water drawn as seen
                  radar: [{at: "2023-06-08T03:48:43", id: S1A_IW_GRDH_1SDV_20230608T034831_20230608T034856_048889_05E116_rtc, why: "calm, two days after the breach"},
                          {at: "2023-06-09T15:37:09", id: S1A_IW_GRDH_1SDV_20230609T153657_20230609T153722_048911_05E1BA_rtc, why: "calm, the evening of the third day"}],
                  rules: [{at: "2023-06-08T08:46", mndwi_min: 0.03, swir_max: 900, why: "the floodwater so laden with silt that its NIR stays high (MNDWI about 0.15): water here is MNDWI over 0.03 and SWIR under 9%, which leaves out the exposed sand (checked by eye against the pass's true colour)"}],
                  skip: [{at: "2023-06-08T03:48", why: "radar: read against ICESat-2, it marks ground as dry that lies metres under the level then (fresh wet mud and shallow water look alike to it); and it finds more water on 9 June than on 8 June while the level fell"},
                         {at: "2023-06-09T15:37", why: "radar: as on 8 June"}]}
        reference: 2023-06-05     # the last clear pass before the dam was destroyed: the reservoir's footprint
        breach: "2023-06-06T02:50:00Z"
        min_seen: 0.2             # a pass is read only if it saw this share of the box clear
        # the water level at the crossing, m above EGM2008: the gauges (Baltic heights, `datum: baltic`, raised by
        # `baltic_m` to EGM2008: inferred from DAHITI's 17.22 m on 4 June against the gauge's 16.77 m on 5 June, never
        # published), then SWOT's river heights each month (`swot`). Researched 26 October 2026: the plant's own series
        # is at the crossing until 9 June (after that its intake channel was cut off, IAEA Update 165); Nikopol's gauge
        # (15 km downstream) to 11 June, when the water left it
        baltic_m: 0.4
        levels:
          - {at: "2023-06-04T19:06:16Z", m: 17.22, place: "Kakhovka reservoir", source: "DAHITI 11364, Sentinel-3 altimetry (EIGEN-6C4)", url: "https://dahiti.dgfi.tum.de/en/11364/"}
          - {at: "2023-06-05T17:00:00Z", m: 16.77, datum: baltic, place: "Kakhovka reservoir", source: "Hydrometeorological Center, 20:00 on 5 June (Chornomorets et al. 2023, doi 10.15407/meteorology2023.04.051)"}
          - {at: "2023-06-06T02:50:00Z", m: 16.77, datum: baltic, place: "Kakhovka reservoir", source: "held until the dam was destroyed"}
          - {at: "2023-06-06T07:00:00Z", m: 16.27, datum: baltic, place: "the plant", source: "IAEA Update 161: 15.44 m at 20:00 after a fall of 83 cm since 10:00"}
          - {at: "2023-06-06T17:00:00Z", m: 15.44, datum: baltic, place: "the plant", source: "IAEA Update 161", url: "https://www.iaea.org/newscenter/pressreleases/update-161-iaea-director-general-statement-on-situation-in-ukraine"}
          - {at: "2023-06-07T15:00:00Z", m: 14.03, datum: baltic, place: "the plant", source: "IAEA Update 162 (18:00)", url: "https://www.iaea.org/newscenter/pressreleases/update-162-iaea-director-general-statement-on-situation-in-ukraine"}
          - {at: "2023-06-08T15:00:00Z", m: 12.7, datum: baltic, place: "the plant", source: "IAEA Update 163 (18:00, about 12.7 m)", url: "https://www.iaea.org/newscenter/pressreleases/update-163-iaea-director-general-statement-on-situation-in-ukraine"}
          - {at: "2023-06-09T16:00:00Z", m: 11.62, datum: baltic, place: "the plant", source: "IAEA Update 164 (19:00)", url: "https://www.iaea.org/newscenter/pressreleases/update-164-iaea-director-general-statement-on-situation-in-ukraine"}
          - {at: "2023-06-10T03:00:00Z", m: 10.55, datum: baltic, place: Nikopol, source: "Ukrhydroenergo (06:00)", url: "https://uhe.gov.ua/media_tsentr/novyny/vtracheno-ponad-tretynu-vody-z-kakhovskoho-vodoskhovyshcha-yaku-nakopychyly"}
          - {at: "2023-06-11T05:00:00Z", m: 9.35, datum: baltic, place: Nikopol, source: "Ukrhydroenergo (08:00)", url: "https://uhe.gov.ua/media_tsentr/novyny/riven-vody-u-kakhovskomu-vodoskhovyshchi-prodovzhuye-znyzhuvatys"}
          - {at: "2023-06-11T17:00:00Z", m: 9.04, datum: baltic, place: Nikopol, source: "Hydrometeorological Center (20:00), the last gauge reading", url: "https://uhe.gov.ua/media_tsentr/novyny/operatyvna-informatsiya-shchodo-naslidkiv-pidryvu-kakhovskoyi-hes"}
          - {at: "2023-06-17T12:00:00Z", m: 9.3, place: "the crossing", source: "settled: the reservoir's volume loss levelled off about 17 June (Yi et al. 2025, doi 10.1029/2024WR038314); the level SWOT measured here from late July"}
        swot:                     # monthly medians of SWOT's river reaches either side of the crossing, interpolated to it
          file: sources/swot_reaches.csv   # NASA Hydrocron, SWORD v16 reaches; every value flagged "bad" (reaches drawn for the reservoir), so monthly medians
          reaches: {"22511500053": 34.57, "22511500063": 34.69}
          at_lon: 34.633
          from: 2023-07-01
          # the river's slope (m per degree of longitude, rising upstream, east): a line through these reaches' medians
          slope: {reaches: {"22511500033": 34.33, "22511500043": 34.45, "22511500053": 34.57, "22511500063": 34.69, "22511500073": 34.81}, months: [2023-08, 2023-10]}
          source: "SWOT L2 river reaches via NASA Hydrocron (https://soto.podaac.earthdatacloud.nasa.gov/hydrocron/v1/timeseries), EGM2008"
        # the bed's ground through the years (the same box and grid as the land's texture; observed, laid on the
        # modelled bed): each layer shown from its own date, crossfaded into the next over `fade_days` (an
        # interpolation between two dates, said so). Before the first, the bed is under the water
        textures:
          fade_days: 40
          layers:
            - {name: c3d_2023_06, era: after, sensor: sentinel-2, start: 2023-06-20, end: 2023-06-20, max_cloud: 5, box_km: [40, 36], centre_km: [3, 10.5], m_per_px: 10, shown_from: 2023-06-07, fade_days: 1, why: "the bed two weeks after the breach, wet mud and silt: the first clear pass after it, shown from the day after the breach as the ground comes out of the water"}
            - {name: c3d_2023_08, era: after, sensor: sentinel-2, start: 2023-08-19, end: 2023-08-19, max_cloud: 5, box_km: [40, 36], centre_km: [3, 10.5], m_per_px: 10, why: "the first growth on the drying bed"}
            - {name: c3d_2024_08, era: after, sensor: sentinel-2, start: 2024-08-23, end: 2024-08-23, max_cloud: 5, box_km: [40, 36], centre_km: [3, 10.5], m_per_px: 10, why: "a year on: willows and reeds"}
            - {name: c3d_2025_08, era: after, sensor: sentinel-2, start: 2025-08-28, end: 2025-08-28, max_cloud: 5, box_km: [40, 36], centre_km: [3, 10.5], m_per_px: 10, why: "two years on: the young forest"}
        icesat2:
          file: sources/icesat2_atl08.json   # in the bed folder: ATL08 100 m segments in the box (granules of 5 and 28 August 2023)
          geoid_m: 22.38                     # EGM2008's geoid height at 47.55 N, 34.60 E (ellipsoid to FABDEM's datum)
          weight: 1.0
          source: "ICESat-2 ATL08 v6 over the former Kakhovka reservoir, from Lehnigk et al. 2026 (Zenodo 10.5281/zenodo.19115397, CC BY 4.0; icesat2_data.zip sha256 98a5a28a)"
        old_maps:
          - sheet: L-36-22 (Nikopol)
            year: 1941
            scale: "1:100 000"
            what: "Red Army General Staff topographic map, before the reservoir (filled 1955–56): spot heights on the floodplain, Baltic heights"
            source: "Indiana University Libraries, VAC9619-001868 (public domain)"
            sha256: d3e5b1cb
            georef: "the sheet's frame corners (34.5–35.0 E, 47.333–47.667 N) to its scan; the sheet's own datum (Pulkovo 1932), about 100 m off WGS84"
            weight: 0.5               # read off a scan by hand, and 82 years older: half a satellite point's pull
            spot_heights:             # read by hand, 26 October 2026 (scan px in brackets)
              - {m: 9.4, lonlat: [34.63157, 47.57222], px: [2990, 3262]}
              - {m: 12.0, lonlat: [34.66728, 47.55138], px: [3625, 3795]}
              - {m: 8.5, lonlat: [34.62637, 47.55173], px: [2900, 3790], note: "water's edge"}
              - {m: 10.4, lonlat: [34.56063, 47.55995], px: [1735, 3585]}
              - {m: 8.3, lonlat: [34.59237, 47.61107], px: [2293, 2268], note: "water's edge, by Mar'ivka"}
      # the two lines' record in 3D (states.py; the user, 25 October 2026): seen (a cut line unlit, steel grey and
      # thinner, as in the 2D film) and heard (the Hum, each line on its side), from the zone's day, when the 3D takes
      # over, to the last report; paced so each side's state can be told: every state held at least `min_hold_s`, a line
      # fading out and swelling back, outages over within the day left out (listed in camera_<variant>.json
      # `record.left_out`)
      record:
        start: 2022-09-06
        lines:                    # the network record's names: the drawn line, its side (pan) and its name on screen
          Ferosplavna-1: {drawn: "Ferosplavna 1, 2", pan: -0.85, label: "FEROSPLAVNA-1 · 330 KV"}
          Dniprovska: {drawn: Dniprovska, pan: 0.85, label: "DNIPROVSKA · 750 KV"}
        dates: [2023-06-06]       # dates held without a line change: the dam destroyed, the reservoir drains
        within_day: omit
        at_s: 4                   # the date appears as the tilt starts
        intro_s: 1.5
        run_s: 81                 # to 11 September 2026, as the camera reaches the north shore
        min_hold_s: 1.3
        loss_hold_s: 2.0          # a complete loss lasting days: at least this, 0.03 s a day more, up to 3.5 s
        loss_day_s: 0.03
        loss_max_s: 3.5
        fade_off_s: 0.4           # a cut line fades out this fast (seen; heard: `sound.fall_s`)
        fade_on_s: 0.8            # and swells back this slowly
        names_at_s: 10            # the lines' names on their sides, as the camera comes down between them
        # the dam's destruction at 35 s (the user, 26 October 2026: "at around 35s instead of the current 27s"): from
        # it the date steps day by day through the gauges' readings while the water falls (bed.levels), settling on 17
        # June; the brief cuts in `omit` are left out so the rest keeps its pace (listed in the doc)
        pins:
          - {at: 2023-06-06, s: 35, min_hold_s: 0.9}
          - {at: 2023-06-17, s: 42.5}
        steps: [2023-06-07, 2023-06-08, 2023-06-09, 2023-06-10, 2023-06-11]
        omit:
          - {at: 2023-11-26, lines: [Dniprovska]}
          - {at: 2024-04-04, lines: [Ferosplavna-1]}
          - {at: 2024-10-21, lines: [Ferosplavna-1]}
          - {at: 2024-11-16, lines: [Dniprovska]}
          - {at: 2024-12-02, lines: [Ferosplavna-1]}
        sound: {start_s: 1.5, fade_in_s: 3, swell_s: 0.6, fall_s: 0.3}
      # the flow (the user, 26 October 2026: TouchDesigner's cooking wires, "the direction of energy going to the znpp
      # or going to power the northern ukrainian grid"): dashes running along each connected line toward where its
      # power goes, a drawing convention (states.flow_toward). The direction is sourced: the plant has sent no power to
      # the grid since September 2022, and since then the grid sends power in, so through all of the 3D's record (from
      # 6 September 2022) toward the plant. A period `toward: grid` (before the seizure, say) would run them north.
      flow:
        dash_m: 80                # dashes this far apart along a wire, running this fast: drawn, not measured (the
        speed_mps: 650            # user, 26 October 2026: the speed of their TouchDesigner reference, the first draft's spacing)
        periods:
          - from: 2022-09-06
            toward: plant
            note: "The plant has sent no power to the grid since September 2022; the grid sends power in to keep its shut-down reactors cooled."
            sources:
              - {title: "RFE/RL, December 2023", url: "https://www.rferl.org/a/zaporizhzhya-nuclear-power-plant-safety-ukraine/32711212.html"}
              - {title: "Ukrainska Pravda, January 2026", url: "https://www.pravda.com.ua/eng/news/2026/01/18/8016739"}
              - {title: Wikipedia, url: "https://en.wikipedia.org/wiki/Zaporizhzhia_Nuclear_Power_Plant"}
      terrain_step_m: 20          # the land mesh's spacing (FABDEM is 30 m; the bed 20 m)
      # for the flight south (S6, the user, 4 November 2026; a variant's `extras`): the plant, the thermal plant and
      # Enerhodar modelled from OSM's footprints and the heights published (scene3d/plant.py; the reply saved in
      # raw/osm_plant.json), and the land on south of the box (it ends 7.5 km south of the plant, in view as the camera
      # comes toward it): the same five passes over a 12 km strip, crossfaded by the same dates
      plant:
        bbox: [47.455, 34.50, 47.545, 34.72]   # south, west, north, east: the plant, the thermal plant, Enerhodar
      land_south:
        layers:
          - {name: c3s_2021_09, era: before, sensor: sentinel-2, start: 2021-09-08, end: 2021-09-08, max_cloud: 5, box_km: [40, 12], centre_km: [3, -13.5], m_per_px: 10}
          - {name: c3s_2023_06, era: after, sensor: sentinel-2, start: 2023-06-20, end: 2023-06-20, max_cloud: 5, box_km: [40, 12], centre_km: [3, -13.5], m_per_px: 10}
          - {name: c3s_2023_08, era: after, sensor: sentinel-2, start: 2023-08-19, end: 2023-08-19, max_cloud: 5, box_km: [40, 12], centre_km: [3, -13.5], m_per_px: 10}
          - {name: c3s_2024_08, era: after, sensor: sentinel-2, start: 2024-08-23, end: 2024-08-23, max_cloud: 5, box_km: [40, 12], centre_km: [3, -13.5], m_per_px: 10}
